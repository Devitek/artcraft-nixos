name: renovate

# Keep the GitHub Actions used by this repo up to date (self-hosted Renovate).
# nvfetcher owns the Craft app versions; Renovate only touches `uses:` pins.
# The token must carry **Workflows: Read and write** to edit files under
# .github/workflows/ (see docs/adr/0008-renovate-github-actions.md).
on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        required: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.ARTCRAFT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
