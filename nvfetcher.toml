# nvfetcher tracks the latest GitHub release of each app and records the
# per-arch tarball hash into _sources/generated.{json,nix}.
# One entry per (app, arch). Regenerate with: nvfetcher -c nvfetcher.toml

[photocraft-x86_64-linux]
src.github = "storytold/photocraft"
src.prefix = "v"
fetch.url = "https://github.com/storytold/photocraft/releases/download/v$ver/photocraft-$ver-linux-x86_64.tar.gz"

[photocraft-aarch64-linux]
src.github = "storytold/photocraft"
src.prefix = "v"
fetch.url = "https://github.com/storytold/photocraft/releases/download/v$ver/photocraft-$ver-linux-aarch64.tar.gz"

